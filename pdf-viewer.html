<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
        content="#218838">

    <title>PDF Viewer - FODE Learning Hub</title>

    <link rel="stylesheet"
        href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f5;
            color: #222;
        }

        /* ==============================
           HEADER
        ============================== */

        .viewer-header {
            background: #218838;
            color: white;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.15);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .viewer-brand {
            display: flex;
            align-items: center;
            gap: 12px;

            min-width: 0;
        }

        .viewer-brand img {
            width: 44px;
            height: 44px;

            object-fit: contain;

            background: white;
            border-radius: 5px;
        }

        .viewer-brand-text {
            font-size: 20px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-menu {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .viewer-button {
            border: none;
            background: white;
            color: #218838;

            padding: 10px 15px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 14px;
            font-weight: bold;

            text-decoration: none;
        }

        .viewer-button:hover {
            background: #e8f5e9;
        }


        /* ==============================
           RESOURCE INFORMATION
        ============================== */

        .resource-info {
            background: white;

            padding: 15px 20px;

            border-bottom:
                1px solid #ddd;

            box-shadow:
                0 1px 4px rgba(0, 0, 0, 0.08);
        }

        .resource-title {
            margin: 0 0 6px;

            font-size: 20px;
            color: #1f2937;
        }

        .resource-details {
            margin: 0;

            color: #666;

            font-size: 14px;
        }


        /* ==============================
           PDF AREA
        ============================== */

        .pdf-container {
            width: 100%;

            height: calc(100vh - 145px);

            min-height: 500px;

            background: #525659;

            position: relative;
        }

        #pdfFrame {
            width: 100%;
            height: 100%;

            border: none;

            display: block;

            background: white;
        }


        /* ==============================
           LOADING
        ============================== */

        .loading {
            position: absolute;

            inset: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            background: #525659;

            color: white;

            z-index: 5;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 5px solid rgba(255,255,255,0.3);

            border-top:
                5px solid white;

            border-radius: 50%;

            animation:
                spin 1s linear infinite;

            margin-bottom: 15px;
        }

        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        /* ==============================
           ERROR
        ============================== */

        .error-box {
            position: absolute;

            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            background: #525659;

            color: white;

            padding: 30px;

            z-index: 10;
        }

        .error-icon {
            font-size: 55px;

            margin-bottom: 15px;
        }

        .error-box h2 {
            margin: 0 0 10px;
        }

        .error-box p {
            max-width: 600px;

            line-height: 1.6;

            color: #eee;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 700px) {

            .viewer-header {
                height: 60px;

                padding: 0 10px;
            }

            .viewer-brand img {
                width: 38px;
                height: 38px;
            }

            .viewer-brand-text {
                font-size: 15px;
            }

            .viewer-button {
                padding: 8px 10px;

                font-size: 12px;
            }

            .resource-info {
                padding: 12px;
            }

            .resource-title {
                font-size: 16px;
            }

            .resource-details {
                font-size: 12px;
            }

            .pdf-container {
                height: calc(100vh - 125px);

                min-height: 400px;
            }

        }

    </style>
</head>


<body>


    <!-- ==========================================
         HEADER
    =========================================== -->

    <header class="viewer-header">

        <div class="viewer-brand">

            <img
                src="images/logo.png"
                alt="FODE Logo"
                onerror="this.style.display='none';"
            >

            <div class="viewer-brand-text">
                FODE Offline Learning Hub
            </div>

        </div>


        <div class="viewer-menu">

            <a
                href="library.html"
                class="viewer-button"
            >
                ← Library
            </a>

            <button
                class="viewer-button"
                id="openPdfButton"
                type="button"
            >
                Open PDF
            </button>

        </div>

    </header>



    <!-- ==========================================
         RESOURCE INFORMATION
    =========================================== -->

    <section class="resource-info">

        <h1
            id="resourceTitle"
            class="resource-title"
        >
            Loading PDF...
        </h1>

        <p
            id="resourceDetails"
            class="resource-details"
        >
            Preparing document...
        </p>

    </section>



    <!-- ==========================================
         PDF VIEWER
    =========================================== -->

    <main class="pdf-container">


        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <div>
                Loading PDF...
            </div>

        </div>



        <!-- Native Browser PDF Viewer -->

        <iframe
            id="pdfFrame"
            title="PDF Viewer"
            loading="eager"
        ></iframe>



        <!-- Error -->

        <div
            id="errorBox"
            class="error-box"
        >

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Unable to open PDF
            </h2>

            <p id="errorMessage">
                The PDF could not be loaded.
            </p>

            <button
                id="retryButton"
                class="viewer-button"
                type="button"
            >
                Try Again
            </button>

        </div>


    </main>



    <!-- ==========================================
         CENTRAL DATA
    =========================================== -->

    <script src="js/data.js"></script>


    <!-- ==========================================
         PDF VIEWER SCRIPT
    =========================================== -->

    <script src="js/pdf-viewer.js"></script>


</body>

</html>
